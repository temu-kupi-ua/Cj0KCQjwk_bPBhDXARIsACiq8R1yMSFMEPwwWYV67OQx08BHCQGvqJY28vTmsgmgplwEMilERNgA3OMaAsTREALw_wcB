<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Scan</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#05060a;
    color:#e5e7eb;
    font-family:Consolas;
}

.container{
    width:90%;
    max-width:800px;
    margin:80px auto;
}

.box{
    background:#0b1220;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    opacity:0;
    transform:translateY(10px);
    transition:0.4s;
}

.show{
    opacity:1;
    transform:translateY(0);
}

.progress{
    height:18px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:#3b82f6;
}

.label{ color:#94a3b8; }
.value{ color:white; margin-top:5px; }

#map{
    height:300px;
    display:none;
    border-radius:10px;
    margin-top:10px;
}

/* ADMIN */
.adminBtn{
    position:fixed;
    top:10px;
    left:10px;
    background:#111827;
    color:white;
    padding:6px;
    border-radius:8px;
    cursor:pointer;
}

.admin{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#05060a;
    z-index:9999;
    padding:20px;
}

.close{
    position:absolute;
    top:10px;
    right:15px;
    cursor:pointer;
    color:white;
}
</style>
</head>

<body>

<!-- ADMIN BUTTON -->
<div class="adminBtn" onclick="openAdmin()">ADMIN</div>

<div class="container">

<!-- SCAN -->
<div class="box show">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="value" id="percent">0%</div>
</div>

<div class="box" id="ipBox"><div class="label">IP</div><div class="value" id="ip">---</div></div>
<div class="box" id="countryBox"><div class="label">COUNTRY</div><div class="value" id="country">---</div></div>
<div class="box" id="cityBox"><div class="label">CITY</div><div class="value">Bortiatyn</div></div>
<div class="box" id="nameBox"><div class="label">NAME</div><div class="value">Protsyk Maksym</div></div>
<div class="box" id="deviceBox"><div class="label">DEVICE</div><div class="value" id="device"></div></div>
<div class="box" id="timeBox"><div class="label">TIME</div><div class="value" id="time"></div></div>

<div id="map"></div>

</div>

<!-- ADMIN PANEL -->
<div class="admin" id="admin">

<span class="close" onclick="closeAdmin()">✖</span>

<h2>ADMIN PANEL</h2>

<div id="adminData">Waiting...</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// DEVICE + TIME
document.getElementById("device").innerText = navigator.userAgent;

setInterval(()=>{
document.getElementById("time").innerText =
new Date().toLocaleString();
},1000);

// SCAN
let p=0;
let bar=document.getElementById("bar");
let percent=document.getElementById("percent");

let visitor={};

let scan=setInterval(()=>{
p++;
bar.style.width=p+"%";
percent.innerText=p+"%";

if(p>=100){
clearInterval(scan);
revealAll();
}
},25);

// REVEAL DATA
function revealAll(){

fetch("https://ipapi.co/json/")
.then(r=>r.json())
.then(d=>{

visitor=d;

setTimeout(()=>{
document.getElementById("ip").innerText=d.ip;
document.getElementById("ipBox").classList.add("show");
},200);

setTimeout(()=>{
document.getElementById("country").innerText=d.country_name;
document.getElementById("countryBox").classList.add("show");
},600);

setTimeout(()=>document.getElementById("cityBox").classList.add("show"),1000);
setTimeout(()=>document.getElementById("nameBox").classList.add("show"),1400);
setTimeout(()=>document.getElementById("deviceBox").classList.add("show"),1800);
setTimeout(()=>document.getElementById("timeBox").classList.add("show"),2200);

setTimeout(showMap,2600);

});

}

// MAP
function showMap(){

document.getElementById("map").style.display="block";

let map=L.map('map').setView([49.80933,23.39702],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:''
}).addTo(map);

L.marker([49.80933,23.39702])
.addTo(map)
.bindPopup("Bortiatyn 📍")
.openPopup();

}

// ADMIN OPEN
function openAdmin(){

document.getElementById("admin").style.display="block";

document.getElementById("adminData").innerHTML=`
IP: ${visitor.ip || "-"}<br>
Country: ${visitor.country_name || "-"}<br>
City: Bortiatyn<br>
Time: ${new Date().toLocaleString()}<br>
Device: ${navigator.userAgent}
`;

}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

</script>

</body>
</html>
