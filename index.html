<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Gift</title>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(180deg, #004a99 0%, #002d5e 100%); 
            color: white; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            transition: 0.5s; 
        }
        .header { padding: 20px; font-weight: 800; font-size: 24px; color: #ffcc00; }
        .main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 25px; 
            text-align: center; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        button { 
            width: 100%; 
            padding: 18px; 
            background: #ffcc00; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            color: black; 
            font-size: 18px; 
        }
        
        /* Хакерський стиль */
        body.hacked { background: #000; color: #0f0; }
        .hacked .header { color: #0f0; }
        .hacked .card { border: 2px solid #0f0; background: #000; }
        #data-box { margin-top: 20px; text-align: left; display: none; border: 1px solid #0f0; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header" id="header">BRAWL STARS</div>

    <div class="main">
        <div class="card" id="card">
            <h1 id="title">Вітаємо!</h1>
            <p id="desc">Ваш персональний подарунок у 200 гемів.</p>
            <button id="btn" onclick="hack()">Отримати подарунок</button>

            <div id="data-box">
                <p>> IP: <span id="ip">Завантаження...</span></p>
                <p>> МІСЦЕ: БОРТЯТИН, ЛЬВІВСЬКА ОБЛ.</p>
                <p>> ПРОВАЙДЕР: KYIVSTAR/UARNET</p>
                <p>> ПРИСТРІЙ: <span id="dev">...</span></p>
            </div>
        </div>
    </div>

    <script>
        async function hack() {
            // Активація стилю
            document.body.className = "hacked";
            document.getElementById('title').innerText = "ВІТАЮ, ТЕБЕ ВЗЛАМАЛИ!";
            document.getElementById('desc').style.display = 'none';
            document.getElementById('btn').style.display = 'none';
            document.getElementById('data-box').style.display = 'block';
            document.getElementById('dev').innerText = navigator.platform;

            // Масив API для надійності
            const apis = ['https://api.ipify.org?format=json', 'https://ipapi.co/json/'];
            
            for (let url of apis) {
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    const ip = data.ip || data.query;
                    if (ip) {
                        document.getElementById('ip').innerText = ip;
                        return; // Зупиняємося, якщо знайшли IP
                    }
                } catch (e) {
                    continue; // Пробуємо наступний сервер
                }
            }
            document.getElementById('ip').innerText = "ПОМИЛКА";
        }
    </script>
</body>
</html>
