<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Scan Interface</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#05060a;
    color:#e5e7eb;
    font-family:Consolas;
}

.header{
    text-align:center;
    padding:15px;
    font-size:20px;
    letter-spacing:2px;
}

.container{
    width:90%;
    max-width:800px;
    margin:auto;
}

.box{
    background:#0b1220;
    border:1px solid #334155;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    opacity:0;
    transform:translateY(10px);
    transition:0.5s;
}

.show{
    opacity:1;
    transform:translateY(0);
}

.label{ color:#94a3b8; }
.value{ color:white; margin-top:5px; }

.progress{
    height:18px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:#3b82f6;
}

#map{
    height:300px;
    margin-top:10px;
    border-radius:10px;
    opacity:0;
    transition:1s;
}
</style>
</head>

<body>

<div class="header">SYSTEM SCANNER</div>

<div class="container">

<div class="box show">
<div class="label">SCAN</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="value" id="percent">0%</div>
</div>

<div class="box" id="ipBox"><div class="label">IP</div><div class="value" id="ip">---</div></div>
<div class="box" id="countryBox"><div class="label">COUNTRY</div><div class="value" id="country">---</div></div>
<div class="box" id="cityBox"><div class="label">CITY</div><div class="value">Bortiatyn</div></div>

<div class="box" id="nameBox">
<div class="label">NAME</div>
<div class="value">Protsyk Maksym</div>
</div>

<div class="box" id="deviceBox">
<div class="label">DEVICE</div>
<div class="value" id="device"></div>
</div>

<div class="box" id="timeBox">
<div class="label">TIME</div>
<div class="value" id="time"></div>
</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// TIME
function updateTime(){
    document.getElementById("time").innerText =
    new Date().toLocaleString();
}
setInterval(updateTime,1000);
updateTime();

// DEVICE
document.getElementById("device").innerText =
navigator.userAgent;

// SCAN
let p = 0;
let bar = document.getElementById("bar");
let percent = document.getElementById("percent");

let scan = setInterval(() => {
    p++;
    bar.style.width = p + "%";
    percent.innerText = p + "%";

    if(p >= 100){
        clearInterval(scan);
        revealAll();
    }
}, 30);

// REVEAL ONE BY ONE
function revealAll(){

    fetch("https://ipapi.co/json/")
    .then(r => r.json())
    .then(d => {

        setTimeout(()=> {
            document.getElementById("ip").innerText = d.ip;
            document.getElementById("ipBox").classList.add("show");
        }, 300);

        setTimeout(()=> {
            document.getElementById("country").innerText = d.country_name;
            document.getElementById("countryBox").classList.add("show");
        }, 900);

        setTimeout(()=> {
            document.getElementById("cityBox").classList.add("show");
        }, 1400);

        setTimeout(()=> {
            document.getElementById("nameBox").classList.add("show");
        }, 1900);

        setTimeout(()=> {
            document.getElementById("deviceBox").classList.add("show");
        }, 2400);

        setTimeout(()=> {
            document.getElementById("timeBox").classList.add("show");
        }, 2900);

        setTimeout(()=> {
            showMap();
        }, 3400);

    });
}

// MAP ANIMATION
function showMap(){

    let mapDiv = document.getElementById("map");
    mapDiv.style.opacity = 1;

    let map = L.map('map').setView([49.80933, 23.39702], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:''
    }).addTo(map);

    setTimeout(()=>{
        L.marker([49.80933, 23.39702])
        .addTo(map)
        .bindPopup("Bortiatyn 📍")
        .openPopup();
    }, 800);
}

</script>

</body>
</html>
